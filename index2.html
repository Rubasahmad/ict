<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Threat Intelligence Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: 'Segoe UI';
    background: #0a0f1c;
    color:#00ffff;
    text-align:center;
}
.container { max-width:1100px; margin:auto; padding:20px; }

h1 { text-shadow:0 0 15px cyan; }

input, button {
    padding:10px;
    border-radius:8px;
    border:none;
}

button {
    background:#00ffff;
    color:black;
    cursor:pointer;
}

.card {
    margin-top:20px;
    padding:15px;
    background:rgba(0,0,0,0.7);
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,255,255,0.3);
}

#map { height:300px; margin-top:20px; }
canvas { margin-top:20px; }

.loader {
    border:5px solid #333;
    border-top:5px solid cyan;
    border-radius:50%;
    width:40px;
    height:40px;
    animation:spin 1s linear infinite;
    margin:auto;
}

.hidden { display:none; }
.high { color:red; }
.medium { color:orange; }
.low { color:lightgreen; }

@keyframes spin { 100% { transform:rotate(360deg);} }
</style>
</head>

<body>
<div class="container">
<h1>🛡 Cyber Threat Intelligence Dashboard</h1>

<button onclick="getMyIP()">📍 Detect My IP</button>

<div>
<input id="ipInput" placeholder="Enter IP Address">
<button onclick="checkIP()">Analyze</button>
</div>

<div id="loader" class="loader hidden"></div>
<div id="result" class="card"></div>
<div id="map"></div>

<canvas id="riskChart"></canvas>

<h3>Recent Searches</h3>
<ul id="history"></ul>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const apiKey = "c019492c73444c75a6c7264e0fdf3562";
let map, chart;

function initMap(lat=0, lon=0){
    if(map) map.remove();
    map = L.map('map').setView([lat,lon],10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.marker([lat,lon]).addTo(map);
}
initMap();

function isValidIP(ip){
    return /^(25[0-5]|2[0-4]\d|[01]?\d\d?)\./.test(ip);
}

async function getMyIP(){
    const res = await fetch(`https://api.ipgeolocation.io/ipgeo?apiKey=${apiKey}`);
    const data = await res.json();
    document.getElementById("ipInput").value = data.ip;
    checkIP();
}

async function checkIP(){
    const ip = document.getElementById("ipInput").value;
    const result = document.getElementById("result");
    const loader = document.getElementById("loader");

    if(!isValidIP(ip)){
        result.innerHTML = "Invalid IP format";
        return;
    }

    loader.classList.remove("hidden");
    result.innerHTML="";

    try{
        const res = await fetch(`https://api.ipgeolocation.io/ipgeo?apiKey=${apiKey}&ip=${ip}`);
        const data = await res.json();
        loader.classList.add("hidden");

        let risk=0;
        let vpn = data.isp.toLowerCase().includes("vpn") ? 1:0;
        let hosting = data.organization?.toLowerCase().includes("hosting") ? 1:0;

        if(vpn) risk+=40;
        if(hosting) risk+=30;

        let level="low";
        if(risk>50) level="high";
        else if(risk>20) level="medium";

        result.innerHTML = `
        <h3>IP Intelligence</h3>
        <p><b>${data.ip}</b></p>
        <p>${data.city}, ${data.country_name}</p>
        <p>${data.isp}</p>
        <p class="${level}">Risk Score: ${risk} (${level})</p>
        <img src="https://flagsapi.com/${data.country_code2}/flat/32.png">
        <br><button onclick="copyIP('${data.ip}')">Copy IP</button>
        `;

        initMap(parseFloat(data.latitude), parseFloat(data.longitude));
        updateChart(vpn, hosting);
        saveHistory(ip);

    }catch(e){
        loader.classList.add("hidden");
        result.innerHTML="API Error";
    }
}

function updateChart(vpn, hosting){
    const ctx = document.getElementById('riskChart');
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['VPN','Hosting'],
            datasets: [{ data: [vpn, hosting] }]
        }
    });
}

function copyIP(ip){ navigator.clipboard.writeText(ip); }

function saveHistory(ip){
    let h = JSON.parse(localStorage.getItem("h"))||[];
    if(!h.includes(ip)) h.unshift(ip);
    if(h.length>5) h.pop();
    localStorage.setItem("h", JSON.stringify(h));
    renderHistory();
}

function renderHistory(){
    const list=document.getElementById("history");
    let h=JSON.parse(localStorage.getItem("h"))||[];
    list.innerHTML="";
    h.forEach(ip=>{
        let li=document.createElement("li");
        li.textContent=ip;
        li.onclick=()=>{document.getElementById("ipInput").value=ip; checkIP();}
        list.appendChild(li);
    });
}

renderHistory();
</script>
</body>
</html>
